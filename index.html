<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECO-UNIFORM: Калькулятор срока службы</title>
    <style>
        :root {
            --bg-dark: #0a0a12;
            --panel-bg: rgba(22, 22, 32, 0.92);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent-primary: #c77dff;
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            --stat-bg: rgba(255, 255, 255, 0.03);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            background-color: var(--bg-dark);
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--panel-border);
            background: var(--panel-bg);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-main);
        }
        .logo span { color: var(--accent-primary); }

        nav button {
            background: transparent;
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-left: 10px;
        }
        nav button:hover { border-color: var(--accent-primary); color: var(--text-main); }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 20px;
            padding: 30px;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            padding: 25px;
            border-radius: 12px;
        }

        h2 { margin-top: 0; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px; font-size: 1.2rem; margin-bottom: 15px; }
        h3 { color: var(--accent-primary); margin-top: 0; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 15px; border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }

        .stat-card {
            background: var(--stat-bg);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-primary);
        }
        .stat-val { font-size: 2rem; font-weight: bold; color: var(--accent-primary); display: block; line-height: 1; }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        
        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .btn-calc {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: white;
            border: 2px solid var(--accent-primary);
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-calc:hover {
            background: var(--accent-primary);
            color: black;
        }

        #result-area {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed var(--panel-border);
            display: none;
        }

        .result-display { text-align: center; }
        .result-number {
            font-size: 3rem;
            font-weight: 900;
            color: var(--accent-primary);
            line-height: 1;
        }
        .result-unit { font-size: 1rem; color: var(--text-main); }

        .analysis-card {
            background: var(--stat-bg);
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 6px;
            border-left: 3px solid var(--accent-primary);
        }
        .analysis-val { font-size: 1.4rem; font-weight: bold; display: block; }
        .analysis-plus { color: #4ade80; }
        .analysis-minus { color: #f87171; }
        .analysis-label { font-size: 0.75rem; color: var(--text-muted); }

        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .panel { border-radius: 0; border: none; padding: 20px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">ECO<span>UNIFORM</span></div>
        <nav>
            <button>Главная</button>
            <button class="active">Калькулятор</button>
            <button>О проекте</button>
            <button>Контакты</button>
        </nav>
        <div style="font-size: 0.75rem; color: var(--text-muted);">RU / EN</div>
    </header>

    <div class="dashboard-grid">
        <!-- Левая панель: Статистика -->
        <aside class="panel">
            <h3>Статистика проекта</h3>
            <div class="stat-card">
                <span class="stat-val">2.8</span>
                <span class="stat-label">Года средний срок службы</span>
            </div>
            <div class="stat-card">
                <span class="stat-val">73%</span>
                <span class="stat-label">Экономия ресурсов</span>
            </div>
            <div class="stat-card">
                <span class="stat-val">12</span>
                <span class="stat-label">Единиц одежды в базе</span>
            </div>
        </aside>

        <!-- Центр: Калькулятор -->
        <main class="panel">
            <h2>Калькулятор срока службы</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">
                Расчёт срока службы вещей и варианты продления ресурса. Введите параметры для анализа износа ткани.
            </p>

            <div class="form-group">
                <label for="baseMonths">Базовый срок службы (мес):</label>
                <input type="number" id="baseMonths" value="24" min="1">
            </div>

            <div class="form-group">
                <label for="washType">Тип ухода за вещью:</label>
                <select id="washType">
                    <option value="gentle" selected>Бережный уход (ручная стирка, сушка в тени)</option>
                    <option value="normal">Обычный уход (машинная стирка)</option>
                    <option value="harsh">Жёсткий уход (горячая стирка)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="stains">Количество сильных загрязнений в месяц:</label>
                <input type="number" id="stains" value="1" min="0">
            </div>

            <button class="btn-calc" onclick="calculateResult()">Рассчитать срок службы</button>

            <div id="result-area">
                <div class="result-display">
                    <span class="result-number"><span id="resVal">0</span></span>
                    <span class="result-unit"> мес.</span>
                </div>
                <p style="text-align: center; color: var(--text-muted);
