<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOUNIFORM — Эко-след школьной формы</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --primary-text: #ffffff;
            --accent: #a855f7; /* фиолетовый */
            --accent-hover: #9333ea;
            --stat-value: #a855f7;
            --stat-label: #a1a1aa;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--primary-text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 2px;
        }

        .lang-switch {
            font-size: 0.9rem;
            color: var(--stat-label);
            cursor: pointer;
        }

        .lang-switch:hover {
            color: var(--primary-text);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Статистика */
        .stat-item {
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
            padding-left: 15px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--stat-value);
            display: block;
        }

        .stat-label {
            color: var(--stat-label);
            font-size: 0.9rem;
        }

        /* Калькулятор */
        .calc-group {
            margin-bottom: 20px;
        }

        .calc-label {
            font-size: 0.85rem;
            color: var(--stat-label);
            margin-bottom: 8px;
            display: block;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px;
            background-color: #0f0f13;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: var(--accent);
            color: white;
        }

        .result-display {
            margin-top: 20px;
            text-align: center;
        }

        .result-number {
            font-size: 3rem;
            font-weight: 700;
            color: var(--stat-value);
        }

        .result-unit {
            color: var(--stat-label);
            font-size: 1rem;
        }

        .advice {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--stat-label);
            font-style: italic;
        }

        /* Аналитика */
        .analysis-item {
            margin-bottom: 15px;
            padding: 12px;
            background-color: rgba(168, 85, 247, 0.1);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .analysis-percent {
            font-weight: 700;
            color: var(--stat-value);
        }

        .analysis-desc {
            color: var(--stat-label);
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .card:first-child, .card:last-child {
                order: 2;
            }
            
            .card:nth-child(2) {
                order: 1;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ECOUNIFORM</div>
        <div class="lang-switch">RU / EN</div>
    </header>

    <div class="container">
        <!-- Блок Статистика -->
        <div class="card">
            <h3 style="margin-top: 0; color: var(--stat-label); text-transform: uppercase; letter-spacing: 1px;">Статистика</h3>
            <div class="stat-item">
                <span class="stat-value" id="avg-lifespan">2.8</span>
                <span class="stat-label">Года средний срок службы</span>
            </div>
            <div class="stat-item">
                <span class="stat-value">73%</span>
                <span class="stat-label">Экономия ресурсов</span>
            </div>
            <div class="stat-item">
                <span class="stat-value">12</span>
                <span class="stat-label">Единиц одежды в базе</span>
            </div>
        </div>

        <!-- Блок Калькулятор -->
        <div class="card">
            <h3 style="margin-top: 0; color: var(--stat-label); text-transform: uppercase; letter-spacing: 1px;">Калькулятор срока службы</h3>
            
            <div class="calc-group">
                <label class="calc-label">Базовый срок службы (мес):</label>
                <input type="number" id="base-months" value="24" min="1">
            </div>

            <div class="calc-group">
                <label class="calc-label">Тип ухода:</label>
                <select id="care-type">
                    <option value="gentle">Бережный (ручная стирка)</option>
                    <option value="normal">Обычная стирка</option>
                    <option value="hot">Горячая стирка</option>
                </select>
            </div>

            <div class="calc-group">
                <label class="calc-label">Загрязнений в месяц:</label>
                <input type="number" id="stains-per-month" value="1" min="0">
            </div>

            <button onclick="calculate()">Рассчитать</button>

            <div class="result-display">
                <div class="result-number" id="result-value">33</div>
                <div class="result-unit">мес.</div>
                <div class="advice" id="advice-text">Совет: отличный выбор. Суши вещь в тени, в расправленном виде.</div>
            </div>
        </div>

        <!-- Блок Аналитика -->
        <div class="card">
            <h3 style="margin-top: 0; color: var(--stat-label); text-transform: uppercase; letter-spacing: 1px;">Аналитика</h3>
            <div class="analysis-item">
                <span class="analysis-percent">+40%</span>
                <span class="analysis-desc">При бережном уходе</span>
            </div>
            <div class="analysis-item">
                <span class="analysis-percent">-15%</span>
                <span class="analysis-desc">При обычной стирке</span>
            </div>
            <div class="analysis-item">
                <span class="analysis-percent">-40%</span>
                <span class="analysis-desc">При горячей стирке</span>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            // Получаем данные
            let base = parseInt(document.getElementById('base-months').value) || 24;
            const careType = document.getElementById('care-type').value;
            const stains = parseInt(document.getElementById('stains-per-month').value) || 0;

            // Логика расчета
            let result = base;

            // Коэффициенты из блока "Аналитика"
            if (careType === 'gentle') {
                result = Math.round(result * 1.4); // +40%
            } else if (careType === 'normal') {
                result = Math.round(result * 0.85); // -15%
            } else if (careType === 'hot') {
                result = Math.round(result * 0.6); // -40%
            }

            // Штраф за загрязнения (упрощенно: -1 месяц за каждые 2 загрязнения)
            result -= Math.floor(stains / 2);

            // Защита от отрицательных значений
            if (result < 1) result = 1;

            // Вывод результата
            document.getElementById('result-value').innerText = result;

            // Генерация совета
            const adviceElement = document.getElementById('advice-text');
            if (careType === 'gentle') {
                adviceElement.innerText = "Совет: отличный выбор. Суши вещь в тени, в расправленном виде.";
            } else if (careType === 'hot') {
                adviceElement.innerText = "Совет: горячая стирка сильно сокращает жизнь ткани. Попробуйте снизить температуру до 30°C.";
            } else {
                adviceElement.innerText = "Совет: старайтесь стирать реже и использовать жидкие средства для сохранения цвета.";
            }
        }
    </script>
</body>
</html>
