<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECO-UNIFORM: Gothic Calculator</title>
    <style>
        :root {
            --bg-color: #0f0a15; /* Тёмно-фиолетовый фон */
            --panel-bg: rgba(20, 18, 30, 0.85); /* Полупрозрачные панели (стекло) */
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent: #c77dff; /* Яркий акцент (пурпурный) */
            --accent-hover: #f0a1ff;
            --text-main: #ffffff;
            --text-muted: #a08fb0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            /* --- ВОТ ЗДЕСЬ МОЖНО ПОСТАВИТЬ ТВОЮ КАРТИНКУ --- */
            /* Раскомментируй строку ниже и вставь ссылку на фото */
            /* background-image: url('ссылка_на_твоё_фото.jpg'); */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Затемнение фона, чтобы текст читался всегда */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(15, 10, 21, 0.9) 0%, rgba(5, 3, 10, 0.95) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            padding: 20px 0;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 20px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-main);
            text-shadow: 0 0 15px rgba(199, 125, 255, 0.4);
            position: relative;
        }
        
        .logo span { color: var(--accent); }

        .nav-bar button {
            background: transparent;
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 8px 16px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .nav-bar button:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 250px 1fr 250px;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            padding: 20px;
            border-radius: 12px;
            position: relative;
        }

        /* Декоративные уголки HUD */
        .panel::before, .panel::after {
            content: '';
            position: absolute;
            border: 2px solid var(--accent);
            z-index: 2;
            opacity: 0.3;
        }
        .panel::before { top: 0; left: 0; width: 40px; height: 40px; border-right: none; border-bottom: none; }
        .panel::after { bottom: 0; right: 0; width: 40px; height: 40px; border-left: none; border-top: none; }

        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 3px solid var(--accent);
        }

        .stat-val {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent);
            display: block;
        }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }

        .main-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--panel-border);
            padding: 30px;
            border-radius: 16px;
            position: relative;
        }

        .main-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            pointer-events: none;
        }

        h1 { margin: 0 0 10px 0; color: var(--text-main); text-transform: uppercase; letter-spacing: 2px; }
        p.subtitle { color: var(--text-muted); margin-bottom: 30px; line-height: 1.5; }

        .form-group { margin-bottom: 20px; }
