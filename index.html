<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECO-UNIFORM: Калькулятор</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a12;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        header {
            padding: 20px 40px;
            border-bottom: 1px solid #2a2a35;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .logo span { color: #c77dff; }
        .wrap {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 20px;
            padding: 30px;
            max-width: 1300px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .panel {
            background: #16161f;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 25px;
        }
        h3 {
            color: #c77dff;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        .card {
            background: #1f1f2a;
            border-left: 3px solid #c77dff;
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .card b {
            font-size: 1.6rem;
            color: #c77dff;
            display: block;
        }
        .card small { color: #a0a0b0; }
        label {
            display: block;
            color: #a0a0b0;
            text-transform: uppercase;
            font-size: 0.8rem;
            margin: 15px 0 6px 0;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #0d0d14;
            border: 1px solid #2a2a35;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: transparent;
            border: 2px solid #c77dff;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 6px;
            font-size: 1rem;
        }
        button:hover { background: #c77dff; color: #000; }
        #result {
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        #resVal {
            font-size: 3rem;
            font-weight: 900;
            color: #c77dff;
        }
        #tip {
            color: #a0a0b0;
            margin-top: 10px;
        }
        @media (max-width: 900px) {
            .wrap { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">ECO<span>UNIFORM</span></div>
        <div style="color:#a0a0b0; font-size:0.8rem;">RU / EN</div>
    </header>

    <div class="wrap">
        <aside class="panel">
            <h3>Статистика</h3>
            <div class="card"><b>2.8</b><small>Года средний срок службы</small></div>
            <div class="card"><b>73%</b><small>Экономия ресурсов</small></div>
            <div class="card"><b>12</b><small>Единиц одежды в базе</small></div>
        </aside>

        <main class="panel">
            <h3>Калькулятор срока службы</h3>

            <label for="base">Базовый срок службы (мес):</label>
            <input type="number" id="base" value="24" min="1">

            <label for="wash">Тип ухода:</label>
            <select id="wash">
                <option value="gentle">Бережный (ручная стирка)</option>
                <option value="normal">Обычный (машинная стирка)</option>
                <option value="harsh">Жёсткий (горячая стирка)</option>
            </select>

            <label for="stains">Загрязнений в месяц:</label>
            <input type="number" id="stains" value="1" min="0">

            <button onclick="calc()">Рассчитать</button>

            <div id="result">
                <span id="resVal">0</span> мес.
                <p id="tip"></p>
            </div>
        </main>

        <aside class="panel">
            <h3>Аналитика</h3>
            <div class="card"><b>+40%</b><small>При бережном уходе</small></div>
            <div class="card"><b>-15%</b><small>При обычной стирке</small></div>
            <div class="card"><b>-40%</b><small>При горячей стирке</small></div>
        </aside>
    </div>

    <script>
        function calc() {
            var base = parseFloat(document.getElementById("base").value);
            var wash = document.getElementById("wash").value;
            var stains = parseInt(document.getElementById("stains").value);
            if (isNaN(base) || base < 1) base = 24;
            if (isNaN(stains) || stains < 0) stains = 0;

            var months = base;
            var tip = "";

            if (wash === "harsh") {
                months = base * 0.6;
                tip = "Совет: стирай при 30 градусах и не выкручивай вещь.";
            } else if (wash === "normal") {
                months = base * 0.85;
                tip = "Совет: выбирай деликатный режим и мешок для стирки.";
            } else {
                months = base * 1.4;
                tip = "Совет: отличный выбор. Суши вещь в тени, в расправленном виде.";
            }

            months = months - stains * 0.25;
            if (months < 1) months = 1;

            document.getElementById("resVal").textContent = Math.floor(months);
            document.getElementById("tip").textContent = tip;
            document.getElementById("result").style.display = "block";
        }
    </script>
</body>
</html>
