<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Calculator: Срок службы формы</title>
    <style>
        :root {
            --bg-color: #F0F2F5;            /* Очень светлый фон */
            --card-bg: #FFFFFF;             /* Белая карточка */
            --border-color: #C2C9CD;        /* Цвет рамок (серый) */
            --text-main: #333333;           /* Тёмный текст */
            --text-muted: #7A828D;          /* Серый текст */
            --accent-color: #6C5B9F;        /* Фиолетовый акцент (как в скринах) */
            --accent-hover: #52457A;        /* Темнее при наведении */
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        /* Декоративные линии и разделители в стиле новеллы */
        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            margin: 25px 0;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: -4px;
            left: 0;
            right: 0;
            height: 8px;
            background: var(--bg-color);
            clip-path: polygon(0 0, 100% 0, 100% 50%, 50% 100%, 0 50%);
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            font-size: 1.6rem;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 span {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 5px;
            font-weight: normal;
        }

        .description {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            box-sizing: border-box;
            background: #FAFAFA;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(108, 91, 159, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(0);
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: #F9F9FB;
            border-radius: 16px;
            text-align: center;
            display: none;
            border: 1px dashed var(--border-color);
        }

        .result-title {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--accent-color);
            line-height: 1;
        }

        .result-unit {
            font-size: 1.2rem;
            color: var(--text-muted);
            vertical-align: middle;
            font-weight: normal;
        }

        .result-note {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .container { padding: 20px; }
            .result-value { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Eco-Calculator<span>Расчёт ресурса вещи</span></h1>
        <p class="description">
            Оцени влияние ухода на срок службы школьной формы. 
            Бережное отношение продлевает жизнь вещам.
        </p>

        <div class="divider"></div>

        <div class="form-group">
            <label for="baseMonths">Базовый срок (мес):</label>
            <input type="number" id="baseMonths" value="24" min="1" placeholder="Например, 24">
        </div>

        <div class="form-group">
            <label for="washType">Тип ухода:</label>
            <select id="washType">
                <option value="gentle">Бережный уход (ручная стирка)</option>
                <option value="normal">Обычный уход (машинная стирка)</option>
                <option value="harsh">Жёсткий уход (горячая стирка)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="stains">Загрязнения в месяц:</label>
            <input type="number" id="stains" value="1" min="0" placeholder="Количество пятен">
        </div>

        <button onclick="calculate()">Рассчитать срок службы</button>

        <div class="result-box" id="resultBox">
            <p class="result-title">Ожидаемый срок службы</p>
            <div class="result-value"><span id="resultValue">0</span><span class="result-unit"> мес.</span></div>
            <p class="result-note">Результат приблизительный. Данные основаны на модели износа ткани.</p>
        </div>
    </div>

    <script>
        function calculate() {
            const baseMonths = parseFloat(document.getElementById('baseMonths').value);
            const washType = document.getElementById('washType').value;
            const stains = parseInt(document.getElementById('stains').value) || 0;

            let penalty = 0;
            let bonus = 0;

            if (washType === 'harsh') {
                penalty = baseMonths * 0.40; 
            } else if (washType === 'normal') {
                penalty = baseMonths * 0.15; 
            }

            penalty += stains * 0.25;

            if (washType === 'gentle') {
                bonus = baseMonths * 0.20;
            }

            let finalMonths = baseMonths - penalty + bonus;

            if (finalMonths < 1) finalMonths = 1;

            const resultBox = document.getElementById('resultBox');
            const resultValue = document.getElementById('resultValue');
            
            resultBox.style.display = 'block';
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            resultValue.textContent = Math.floor(finalMonths);
        }
    </script>
</body>
</html>
